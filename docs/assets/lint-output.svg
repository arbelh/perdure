<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<rect width="1200" height="360" fill="#ffffff"/>
<rect x="40" y="42.0" width="250" height="56" rx="28" fill="#34A853"/><text x="165.0" y="77" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" letter-spacing="1">CHECKED</text>
<text x="330" y="79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#111111">Every record, against every check</text>
<rect x="40" y="137.0" width="250" height="56" rx="28" fill="#FBBC05"/><text x="165.0" y="172" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111111" letter-spacing="1">NOT CHECKED</text>
<text x="330" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#111111">Whatever was skipped, named with its reason</text>
<rect x="40" y="232.0" width="250" height="56" rx="28" fill="#4285F4"/><text x="165.0" y="267" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" letter-spacing="1">VERDICT</text>
<text x="330" y="269" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#111111">A pass, or the exact contradiction found</text>
<text x="600.0" y="334" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">A pass means exactly what it says.</text>
